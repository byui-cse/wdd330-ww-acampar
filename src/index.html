<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acampar | Início</title>
    <link rel="stylesheet" href="/css/estilo.css" />
    <script src="js/main.js" type="module"></script>
  </head>

  <body>
    <header class="divisor" id="header-principal"></header>
    <main class="divisor">
      <div class="hero">
        <img
          src="/imagens/banner-sm.jpg"
          srcset="imagens/banner-sm.jpg 500w, imagens/banner.jpg"
          alt="imagem de um lago de montanha"
        />
        <div class="logo logo--quadrado">
          <img src="/imagens/Barraca_2517.svg" alt="imagem de barraca para o logo" />
          <div><span class="destacar">Acampar</span></div>
        </div>
        <div class="missao">
          <p>
            Nossa missão é fornecer tudo o que você precisa para dormir
            ao ar livre com conforto e a um preço acessível.
          </p>
        </div>
      </div>

      <section class="produtos">
        <ul class="grid-produtos">
          <li>
            <a href="listagem_produto/index.html?categoria=barracas">
              <img src="imagens/categoria-barracas.svg" alt="Barracas" />
              <h2>Barracas</h2>
            </a>
          </li>
          <li>
            <a href="listagem_produto/index.html?categoria=mochilas">
              <img src="imagens/categoria-mochilas.svg" alt="Mochilas" />
              <h2>Mochilas</h2>
            </a>
          </li>
          <li>
            <a href="listagem_produto/index.html?categoria=sacos-de-dormir">
              <img src="imagens/categoria-sacos-de-dormir.svg" alt="Sacos de Dormir" />
              <h2>Sacos de Dormir</h2>
            </a>
          </li>
          <li>
            <a href="listagem_produto/index.html?categoria=redes">
              <img src="imagens/categoria-redes.svg" alt="Redes" />
              <h2>Redes</h2>
            </a>
          </li>
        </ul>
      </section>
    </main>
    <footer id="footer-principal"></footer>
  </body>
</html>
