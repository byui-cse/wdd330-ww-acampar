<!doctype html>

<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acampar | Finalizar Compra</title>
  <link rel="stylesheet" href="css/estilo.css">
  <script src="../js/checkout.js" type="module"></script>
</head>

<body>
  <header class="divisor" id="header-principal"></header>

  <main class="divisor 0">
    <h2>Revise e Faça seu Pedido</h2>
    <section class="checkout-formulario">
      <form name="checkout">
        <input type="hidden" name="dataPedido" id="dataPedido">

        <fieldset>
          <legend></legend>
          <div class="checkout__nome">
            <label for="pnome">Primeiro Nome</label>
            <input type="text" name="pnome" id="pnome" required>
            <label for="snome">Sobrenome</label>
            <input type="text" name="snome" id="snome" required>
          </div>
          <div class="checkout__endereco">
            <label for="endereco">Endereço</label>
            <input type="text" name="endereco" id="endereco" required>
            <label for="cidade">Cidade</label>
            <input type="text" name="cidade" id="cidade" required>
            <label for="estado">Estado</label>
            <input type="text" name="estado" id="estado" required>
            <label for="cep">CEP</label>
            <input type="text" name="cep" id="cep" required>
          </div>
        </fieldset>

        <fieldset>
          <legend>Pagamento</legend>
          <div class="checkout__pagamento">
            <label for="numeroCartao">Número do Cartão</label>
            <input type="text" name="numeroCartao" id="numeroCartao" required>
            <label for="validade">Validade</label>
            <input type="text" name="validade" id="validade" required>
            <label for="cvv">CVV</label>
            <input type="text" name="cvv" id="cvv" required>
          </div>
        </fieldset>

        <fieldset class="checkout-resumo">
          <legend>Resumo do Pedido</legend>

          <div class="resumo__pedido">
            <div>Itens</div>
            <div id="num-items"></div>
            <div>Subtotal</div>
            <div id="totalCarrinho"></div>
            <div>Imposto</div>
            <div id="imposto"></div>
            <div>Frete</div>
            <div id="frete"></div>
            <div>Total</div>
            <div id="totalPedido"></div>
          </div>
        </fieldset>
        <button type="submit" id="checkoutEnviar">Checkout</button>
      </form>
    </section>
  </main>

  <footer id="main-footer"></footer>
</body>

</html>
